<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;
  background:
    radial-gradient(120% 90% at 80% 6%,rgba(201,168,106,.24),transparent 58%),
    radial-gradient(90% 70% at 4% 96%,rgba(120,140,175,.16),transparent 60%),
    linear-gradient(180deg,#111116,#0c0c0e 70%);
  color:#eeeae3;font-family:"Inter",sans-serif;
  display:flex;flex-direction:column;justify-content:center;padding:0 78px;position:relative}
body::after{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(115deg,rgba(255,255,255,.03) 0 1px,transparent 1px 8px);
  -webkit-mask-image:radial-gradient(80% 70% at 60% 30%,#000 20%,transparent 80%)}
.row{display:flex;align-items:center;gap:20px;margin-bottom:34px;position:relative;z-index:1}
.mark{width:78px;height:78px;border-radius:20px;display:grid;place-items:center;
  font-family:"Cormorant Garamond",serif;font-weight:700;font-size:34px;color:#171208;
  background:linear-gradient(135deg,#e6cd97,#c9a86a);box-shadow:0 10px 28px rgba(201,168,106,.3)}
.name{font-family:"Cormorant Garamond",serif;font-size:40px;font-weight:600;line-height:1}
.sub{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:#a5a29b;margin-top:8px}
h1{position:relative;z-index:1;font-family:"Cormorant Garamond",serif;font-size:78px;font-weight:600;
  line-height:1.05;letter-spacing:-.015em;max-width:20ch}
h1 em{font-style:normal;background:linear-gradient(100deg,#e6cd97,#c9a86a 55%,#b8905a);
  -webkit-background-clip:text;color:transparent}
.cities{position:relative;z-index:1;margin-top:34px;font-size:22px;color:#a5a29b}
.wa{position:relative;z-index:1;margin-top:26px;display:inline-flex;align-items:center;gap:12px;
  align-self:flex-start;background:linear-gradient(140deg,#25d366,#128c4a);color:#fff;
  font-size:24px;font-weight:600;padding:16px 30px;border-radius:999px}
</style></head><body>
<div class="row"><div class="mark">JK</div>
  <div><div class="name">Marmoraria JK</div><div class="sub">Granito · Mármore · Quartzo</div></div></div>
<h1>Bancadas <em>sob medida</em> com instalação própria</h1>
<div class="cities">Curitiba · Fazenda Rio Grande · Araucária · São José dos Pinhais</div>
<div class="wa">Orçamento grátis: (41) 99991-7485</div>
</body></html>
